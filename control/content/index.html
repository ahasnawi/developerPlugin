<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- build:bundleCSSFiles  -->
        <link rel="stylesheet" href="cpIcons.css" media="all">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="dialogs/dialogs.css">
        <!-- endbuild -->

        <script src="../../../../scripts/buildfire.min.js"></script>
        <script src="../../../../scripts/buildfire/services/ai/ai.js"></script>

        <!-- build:bundleJSFiles  -->
        <script src="dialogs/dialogs.js"></script>
        <script src="ai/ai.js"></script>
        <script src="scripts.js"></script>
        <!-- endbuild -->

    </head>
    <body class="hide-scrollbar">
        <div>
            <p class="note">
                <span class="bold">
                    Note:
                </span>
                Some code may not be reflected in
                <a href="https://learn.buildfire.com/en/articles/473176-how-to-preview-your-app-on-your-phone" target="_blank">
                    the app 
                </a>
                and will require publishing to function.
            </p>
            <p class="note" id="buildfireNotPresentWarning">
                <span class="bold text-warning">
                    Warning:&nbsp;
                </span>
                Buildfire SDK scripts are not included in your code. Please include it and reload in order for the plugin to function correctly.
            </p>
            <div class="editor">
                <div id="monacoEditor"></div>
            </div>

            <!-- TODO: switch to flex-between when AI button is re-enabled -->
            <div class="flex-end btns-container">
                <!-- TODO: re-enable AI button when ready -->
                <!-- <button id="createAiBtn" class="btn create-ai-btn">
                    <img src="../../resources/ai_icon.svg" alt="">
                    Create with AI
                </button> 
                <button id="undoBtn">Undo</button> -->

                <div class="flex-between">
                    <a target="_blank" href="https://sdk.buildfire.com/" class="btn sdk-btn">View our SDK</a>
                    <button id="reloadEditorBtn" class="btn run-code-btn">Run Code</button>
                </div>
            </div>
            <hr>
            <div class="button-switch flex-between">
                <div class="text">Auto-Run Code</div>
                <input id="autoReloadSwitch" type="checkbox">
                <label for="autoReloadSwitch" class="label-success"></label>
            </div>
        </div>
    </body>
</html>
